<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Disclosed focused-cell component contract</title></head>
<body><p>Isolated component contract. Synthetic projections; no workbook or runtime success evidence.</p><div id="mount"></div>
<script type="module">
import {PROJECTION_CASES,assertProjectionRoot,assertRenderedProjectionCases,falsifyHiddenProjectionContent,falsifyProjectionDiagnostics} from '../product/focused-cell-projection-oracles.mjs';
import {observeCellContext,contextSnapshotFromObservation} from '../product/focused-cell-dom-observation.mjs';
import {assertNeutralContext,assertWithheldContext} from '../product/focused-cell-observation-oracles.mjs';
const requireTest=(condition,message)=>{if(!condition)throw new Error(message);};
function assertionControl(c,mount) {
  // Minimal manufactured assertion-control DOM, never production component proof.
  mount.replaceChildren();const root=document.createElement('section');root.setAttribute('role','region');root.setAttribute('aria-label','Cell context');root.dataset.testid='cell-context';
  const values=[['value',c.value]];

  if(c.diagnostic!==null)values.push(['diagnostic',c.diagnostic]);

  mount.append(root);return root;
}

  mount.replaceChildren();assertNeutralContext(snapshot(),{root:'home'});

  }

    if(state==='unknown')root.querySelector('[data-testid="cell-context-value"]').textContent='Refresh to confirm current values';
    const check=state==='neutral'?assertNeutralContext:a=>assertWithheldContext(a,prior);
    check(snapshot()); // unique, exposed positive control with absent entity metadata
    for(const mutation of ['duplicate','unexposed'])for(const [i,key] of ['location','table','column','row','type','value','source'].entries()) {
      const clone=root.cloneNode(true);root.replaceWith(clone);check(snapshot());
      const node=document.createElement('div');node.dataset.testid=`cell-context-${key}`;node.textContent=key==='source'?prior.source:'STALE 10 release_items priority Row 1 Number';

      } else {
        clone.querySelector(`[data-testid="cell-context-${key}"]`)?.remove();

    root.remove();

window.__focusedCellContextContract={status:'RUNNING'};

  const mount=document.querySelector('#mount');

    const positiveControls=[];const diagnosticFalsifiers=[];

  } else {
    // Narrow future Luna adapter imports/mounts the real production component.
    const adapterUrl=new URL('./focused-cell-context-adapter.tsx',location.href).href;

    const root=await render(PROJECTION_CASES[0].field);const falsifiers=falsifyHiddenProjectionContent(root,PROJECTION_CASES[0]);

    let states;try{states=stateFalsifiers(controls);}finally{controls.remove();parent.append(mount);}
    window.__focusedCellContextContract={...receipt,falsifiers,diagnosticFalsifiers,stateFalsifiers:states};
  }

</script></body></html>
