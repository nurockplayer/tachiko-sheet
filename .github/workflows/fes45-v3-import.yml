name: Import FES45 v3 bundle
on:
  push:
    branches:
      - design/issue-45-fes45-v2
    paths:
      - .github/workflows/fes45-v3-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/issue-45-fes45-v2
      - name: Download pinned Drive bundle
        shell: bash
        run: |
          set -euo pipefail
          url="https://drive.usercontent.google.com/download?id=1yiPaY7BYwb3g70FdqPvArEFPylriaNdH&export=download&confirm=t"
          curl -L --fail --retry 3 --retry-all-errors "$url" -o /tmp/fes45-v3.zip
          echo "18d2baea8505b473c6ff7e4171c19aa20bc9f051eb88b84002e9eaab13b4cce8  /tmp/fes45-v3.zip" | sha256sum -c -
      - name: Import exact bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fes45-v3
          mkdir -p /tmp/fes45-v3
          unzip -q /tmp/fes45-v3.zip -d /tmp/fes45-v3
          test -d /tmp/fes45-v3/docs/design/fes45-v2
          rm -rf docs/design/fes45-v2
          mkdir -p docs/design
          cp -a /tmp/fes45-v3/docs/design/fes45-v2 docs/design/fes45-v2
          python docs/design/fes45-v2/verify_bundle.py
      - name: Commit exact imported bundle and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fes45-v3-import.yml
          git add docs/design/fes45-v2
          git commit -m "design: import complete FES45 v3 bundle from Drive (Refs #45)"
          git push origin HEAD:design/issue-45-fes45-v2
