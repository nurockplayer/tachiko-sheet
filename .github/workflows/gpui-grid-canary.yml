# Throwaway canary for Sheet #327: the GPUI Kit grid app on three operating
# systems. Push-only on the spike branch; never merged.
name: gpui-grid-canary

on:
  push:
    branches: [spike/gpui-grid]

permissions:
  contents: read

jobs:
  grid:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
          - os: windows-2022
            target: windows
          - os: ubuntu-24.04
            target: linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # gpui-pre 0.3.11 (pulled by gpui-kit 0.9.0) uses `map_or_default`,
      # stable only from Rust 1.98; NSH's 1.97.1 pin fails on macOS.
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan1 \
            clang libclang-dev pkg-config xvfb mesa-vulkan-drivers imagemagick

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prototypes/gpui-grid/target
          key: gpui-grid-${{ runner.os }}-${{ hashFiles('prototypes/gpui-grid/Cargo.lock') }}

      - name: Tests (10k)
        working-directory: prototypes/gpui-grid
        continue-on-error: true
        env:
          GPUI_GRID_SIZE: 10k
        run: |
          set -o pipefail
          mkdir -p logs
          cargo test --release -- --nocapture 2>&1 | tee logs/test-10k.log

      - name: Tests (100k)
        working-directory: prototypes/gpui-grid
        continue-on-error: true
        env:
          GPUI_GRID_SIZE: 100k
        run: |
          set -o pipefail
          mkdir -p logs
          cargo test --release -- --nocapture 2>&1 | tee logs/test-100k.log

      - name: Build and measure
        working-directory: prototypes/gpui-grid
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          start=$(date +%s)
          cargo build --release 2>&1 | tee logs/build.log
          end=$(date +%s)
          echo "build_seconds=$((end - start))" | tee logs/build-time.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/release/gpui-grid.exe"
          else
            bin="target/release/gpui-grid"
          fi
          echo "binary_bytes=$(wc -c < "$bin")" | tee logs/binary-size.txt

      # Real OS windows. Each step starts the release binary twice (10k and
      # 100k), waits for the sweep line, takes a screenshot of the screen while
      # the window is still held, and prints the line. A window that cannot
      # open is a finding: the exact error stays in the logs.
      - name: Sweep in a real window (macOS)
        if: runner.os == 'macOS'
        working-directory: prototypes/gpui-grid
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p logs
          for size in 10k 100k; do
            GPUI_GRID_SIZE=$size GPUI_GRID_SWEEP=logs/sweep-$size.txt \
              GPUI_GRID_HOLD_MS=8000 ./target/release/gpui-grid > logs/window-$size.log 2>&1 &
            pid=$!
            for i in $(seq 1 120); do [ -s logs/sweep-$size.txt ] && break; sleep 1; done
            screencapture -x logs/screenshot-$size.png || echo "screencapture failed: $?"
            echo "--- sweep $size"
            cat logs/sweep-$size.txt 2>/dev/null || echo "no sweep line"
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            sleep 1
          done

      - name: Sweep in a real window (Windows)
        if: runner.os == 'Windows'
        working-directory: prototypes/gpui-grid
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p logs
          for size in 10k 100k; do
            GPUI_GRID_SIZE=$size GPUI_GRID_SWEEP=logs/sweep-$size.txt \
              GPUI_GRID_HOLD_MS=8000 ./target/release/gpui-grid.exe > logs/window-$size.log 2>&1 &
            pid=$!
            for i in $(seq 1 120); do [ -s logs/sweep-$size.txt ] && break; sleep 1; done
            powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$bmp=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$bmp); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$bmp.Save('logs/screenshot-$size.png')" || echo "screenshot failed: $?"
            echo "--- sweep $size"
            cat logs/sweep-$size.txt 2>/dev/null || echo "no sweep line"
            taskkill //F //PID $pid 2>/dev/null || true
            sleep 1
          done

      - name: Sweep in a real window (Linux)
        if: runner.os == 'Linux'
        working-directory: prototypes/gpui-grid
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p logs
          cat > /tmp/gpui-grid-sweep.sh <<'SH'
          set -u
          for size in 10k 100k; do
            GPUI_GRID_SIZE=$size GPUI_GRID_SWEEP=logs/sweep-$size.txt \
              GPUI_GRID_HOLD_MS=8000 ./target/release/gpui-grid > logs/window-$size.log 2>&1 &
            pid=$!
            for i in $(seq 1 120); do [ -s logs/sweep-$size.txt ] && break; sleep 1; done
            import -window root logs/screenshot-$size.png || echo "screenshot failed: $?"
            echo "--- sweep $size"
            cat logs/sweep-$size.txt 2>/dev/null || echo "no sweep line"
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            sleep 1
          done
          SH
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          xvfb-run -a -s "-screen 0 1440x900x24" bash /tmp/gpui-grid-sweep.sh

      - name: Retain the macOS binary for the by-hand check
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpui-grid-macos-binary
          path: prototypes/gpui-grid/target/release/gpui-grid
          retention-days: 14
          if-no-files-found: error

      - name: Retain the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpui-grid-${{ matrix.target }}
          path: prototypes/gpui-grid/logs
          if-no-files-found: warn
