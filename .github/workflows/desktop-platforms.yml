name: Sheet desktop (Windows, Linux)

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-platforms.yml"
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-platforms.yml"

permissions:
  contents: read

concurrency:
  group: sheet-desktop-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }} desktop app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            build: pnpm desktop:build:windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build: pnpm desktop:build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      # npm scripts run under cmd.exe on Windows, where the scripts' inline
      # `CI=true` prefix cannot be parsed; the job supplies it here.
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }}
          rustup default 1.97.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop host unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build the packaged app and bundle
        run: ${{ matrix.build }}

      - name: Retain the bundle (7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sheet-desktop-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle
