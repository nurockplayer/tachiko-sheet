name: Update Homebrew cask

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point the cask at, such as v0.1.0-preview.5
        required: true

permissions:
  contents: read

concurrency:
  group: update-homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require the tap deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::TAP_DEPLOY_KEY is not set, so the cask still points at the previous release."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the release DMG against its checksum file
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="Tachiko-Sheet-$TAG-macos-arm64.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg" --pattern SHA256SUMS.txt
          grep -F "  $dmg" SHA256SUMS.txt | sha256sum --check --strict
          echo "sha256=$(sha256sum "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nurockplayer/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update and push the cask
        env:
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          scripts/update-cask.sh "${TAG#v}" "$SHA256" tap/Casks/tachiko-sheet.rb
          if git -C tap diff --quiet; then
            echo "The cask already points at $TAG."
            exit 0
          fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit --all --message "Update tachiko-sheet to ${TAG#v}"
          git -C tap push
