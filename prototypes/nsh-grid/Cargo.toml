[package]
name = "nsh-grid"
version = "0.1.0"
edition = "2024"

# Throwaway evidence app for Sheet #327. Standalone package so it never joins
# the Sheet workspace or its CI.
[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
